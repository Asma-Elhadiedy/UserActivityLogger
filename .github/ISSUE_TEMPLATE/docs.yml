---
name: Documentation
description: Report an error, missing section, or improvement in the documentation.
title: "[Docs]: "
labels:
  - "documentation"
  - "area: docs"
body:
  - type: input
    id: doc-path
    attributes:
      label: Documentation location
      description: Which file, guide, or section needs improvement?
      placeholder: "e.g., docs/security-and-configuration.md"
    validations:
      required: true
  - type: textarea
    id: issue-description
    attributes:
      label: Description of the problem
      description: What is inaccurate, outdated, unclear, or missing?
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested change
      description: Provide the revised text, code sample, or clarification.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I verified this issue exists in documentation on the master branch.
          required: true
