name: Question & Support
description: Ask a question about how to use or configure UserActivityLogger.
title: "[Question]: "
labels:
  - "question"
body:
  - type: markdown
    attributes:
      value: |
        Before opening a question issue, please check the [Documentation](https://github.com/Asma-Elhadiedy/UserActivityLogger/blob/master/docs/README.md) and consider starting a thread in [GitHub Discussions](https://github.com/Asma-Elhadiedy/UserActivityLogger/discussions).
  - type: input
    id: package-version
    attributes:
      label: UserActivityLogger Version
      placeholder: "e.g., 1.0.10"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Describe what you are trying to accomplish and where you need guidance.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant Setup or Code Context
      description: Share your DbContext configuration or Program.cs setup if relevant.
      render: csharp
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the documentation and existing discussions first.
          required: true
