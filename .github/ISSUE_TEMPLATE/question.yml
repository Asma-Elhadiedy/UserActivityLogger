---
name: Question and support
description: Ask a question about how to use or configure UserActivityLogger.
title: "[Question]: "
labels:
  - "question"
body:
  - type: markdown
    attributes:
      value: |
        Before opening a question issue, review the documentation and search GitHub Discussions.
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "e.g., 1.0.10"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question details
      description: Describe what you are trying to accomplish and where you need guidance.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Code context
      description: Share your DbContext configuration or Program.cs setup if relevant.
      render: csharp
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the documentation and existing discussions first.
          required: true
