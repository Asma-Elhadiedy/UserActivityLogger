---
name: CI

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Markdown links and required files
        run: python3 .github/scripts/check-docs.py

  build-and-pack:
    name: Build, pack, and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore UserActivityLogger.sln

      - name: Build solution
        run: dotnet build UserActivityLogger.sln -c Release --no-restore

      - name: Run automated tests
        run: dotnet test UserActivityLogger.sln -c Release --no-build

      - name: Verify code style formatting
        run: dotnet format style --verify-no-changes --no-restore

      - name: Verify whitespace formatting
        run: >-
          dotnet format whitespace --verify-no-changes --no-restore
          --exclude UserActivityLogger/Constants/ConstPredefinedLogMessage.cs
          UserActivityLogger.Tests/Controllers/DepartmentsController.cs

      - name: Pack NuGet library
        run: >-
          dotnet pack UserActivityLogger/UserActivityLogger.csproj
          -c Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          if-no-files-found: error
