---
name: Code quality

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Code formatting check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore UserActivityLogger.sln

      - name: Verify code style analyzers
        run: dotnet format style --verify-no-changes --no-restore

      - name: Verify whitespace formatting
        run: >-
          dotnet format whitespace --verify-no-changes --no-restore
          --exclude UserActivityLogger/Constants/ConstPredefinedLogMessage.cs
          UserActivityLogger.Tests/Controllers/DepartmentsController.cs
